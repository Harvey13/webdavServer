name: Build Android apps
on:
  push:
    branches: [feature/sftp-server, feature/webdav-reliability]
  pull_request:
    branches: [main, feature/sftp-server]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build WebDAV app
        run: ./gradlew assembleDebug
      - name: Build standalone SFTP app
        run: ./gradlew -p SftpServer assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WebDAV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SftpServer-debug-apk
          path: SftpServer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
